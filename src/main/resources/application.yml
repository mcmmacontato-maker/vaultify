spring:
  application:
    name: vaultify
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  datasource:
    url: jdbc:h2:mem:vaultify
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

jwt:
  secret: ${JWT_SECRET:vaultify-super-secure-jwt-secret-2026-09-16}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vaultify}
    username: ${DATABASE_USERNAME:vaultify}
    password: ${DATABASE_PASSWORD:vaultify}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true