services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vaultify
      POSTGRES_USER: vaultify
      POSTGRES_PASSWORD: vaultify
    ports:
      - "5432:5432"
    volumes:
      - vaultify-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultify -d vaultify"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vaultify-postgres: